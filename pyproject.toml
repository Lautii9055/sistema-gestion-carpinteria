[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carpinteria"
version = "0.1.0"
description = "Sistema de Gestión para Carpintería"
authors = [{ name = "Lautaro Zanino" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carpinteria = ["presentacion/assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
